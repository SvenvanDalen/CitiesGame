name: Launcher

on:
  pull_request:
    paths: ["tools/Launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Launcher-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Tests
        run: dotnet test tools/Launcher/CitiesLauncher.slnx --configuration Release

      - name: Publiceren (controle dat de self-contained build slaagt)
        run: >
          dotnet publish tools/Launcher/CitiesLauncher/CitiesLauncher.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          --output launcher-out
