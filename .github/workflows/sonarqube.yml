name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: svenvandalen
  SONAR_PROJECT_KEY: SvenvanDalen_CitiesGame
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-latest
    # Alleen voor de Unity-DLL's in /opt/unity; de editor zelf wordt niet gestart, dus geen licentie nodig
    container: unityci/editor:ubuntu-6000.5.10f1-base-3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volledige historie voor blame en nieuwe-code-detectie

      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Unity-packages uit de registry ophalen
        # Collections, Mathematics en ugui zitten in de editor; deze komen uit de Unity-registry, in de versie van packages-lock.json
        run: |
          for package in com.unity.burst com.unity.inputsystem; do
            version=$(grep -A1 "\"${package}\"" Cities/Packages/packages-lock.json | grep '"version"' | sed -E 's/.*"([0-9][^"]*)".*/\1/')
            mkdir -p "ci/sonar/.packages/${package}"
            curl --proto '=https' --tlsv1.2 -sSfL "https://download.packages.unity.com/${package}/-/${package}-${version}.tgz" \
              | tar -xz -C "ci/sonar/.packages/${package}" --strip-components=1
            echo "${package} ${version}"
          done

      - name: Analyse met SonarScanner for .NET
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          coverage_exclusions=$(grep -v -e '^#' -e '^[[:space:]]*$' ci/sonar/coverage-exclusions.txt | paste -sd, -)
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="$coverage_exclusions"
          dotnet build ci/sonar/Cities.Sonar.Tests/Cities.Sonar.Tests.csproj --no-incremental
          # EditMode-tests zonder Unity-runtime; PlayMode-tests en categorie UnityRuntime draaien alleen in Unity
          dotnet test ci/sonar/Cities.Sonar.Tests/Cities.Sonar.Tests.csproj --no-build \
            --filter "FullyQualifiedName!~Cities.Tests.PlayMode&TestCategory!=UnityRuntime" \
            --collect "XPlat Code Coverage;Format=opencover" --results-directory TestResults             --logger "trx;LogFileName=fast.trx"
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Testresultaten
        if: always()
        # Zelfde telling als tools/test.ps1 -Suite Fast, als samenvatting bij de run
        run: |
          trx=$(find TestResults -name fast.trx | head -1)
          if [ -z "$trx" ]; then
            echo "Geen testresultaten gevonden." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          counters=$(grep -o '<Counters [^>]*>' "$trx")
          value() { echo "$counters" | sed -E "s/.* $1=\"([0-9]+)\".*/\1/"; }
          {
            echo "### Snelle tests (zonder Unity)"
            echo ""
            echo "| Totaal | Geslaagd | Mislukt |"
            echo "| --- | --- | --- |"
            echo "| $(value total) | $(value passed) | $(value failed) |"
            echo ""
            echo "EditMode-tests met de Unity-runtime en PlayMode-tests draaien lokaal: \`tools/test.ps1 -Suite Unity\`."
          } >> "$GITHUB_STEP_SUMMARY"
