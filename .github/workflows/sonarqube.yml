name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: svenvandalen
  SONAR_PROJECT_KEY: SvenvanDalen_CitiesGame
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-latest
    # Alleen voor de Unity-DLL's in /opt/unity; de editor zelf wordt niet gestart, dus geen licentie nodig
    container: unityci/editor:ubuntu-6000.5.10f1-base-3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volledige historie voor blame en nieuwe-code-detectie

      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Analyse met SonarScanner for .NET
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/TutorialInfo/**"
          dotnet build ci/sonar/Cities.Sonar.csproj --no-incremental
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
